<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fundraiser Hub | Riter CREW</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; max-width: 760px; margin-inline: auto; line-height: 1.5; color: #12263a; background: #f2fbf7; font-size: 1.05rem; }
  h1 { font-size: 1.8rem; margin: 0.25rem 0; color: #0b4f8a; }
  h2 { font-size: 1.35rem; margin: 0.5rem 0; color: #0b4f8a; }
  h3 { margin: 0 0 4px; font-size: 1.1rem; }
  a { color: #0b5cad; }
  .notice { background: #e8f4ff; border: 2px solid #0b5cad; padding: 10px 12px; border-radius: 8px; margin: 12px 0; font-size: 0.95rem; }
  button, .btn { min-height: 48px; padding: 8px 18px; font-size: 1rem; border-radius: 8px; border: 2px solid #0b5cad; background: #fff; color: #0b5cad; cursor: pointer; font-family: inherit; }
  button.primary { background: #0b5cad; color: #fff; }
  button.green { background: #15803d; border-color: #15803d; color: #fff; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid #f59e0b; outline-offset: 2px; }
  .big { display: block; width: 100%; min-height: 80px; font-size: 1.8rem; font-weight: 800; letter-spacing: .04em; margin: 20px 0; border-radius: 14px; background: linear-gradient(135deg,#15803d,#0b5cad); color: #fff; border: 0; }
  .card { background: #fff; border: 2px solid #b6d9c9; border-radius: 12px; padding: 12px 14px; margin: 12px 0; }
  .card.sel { border-color: #0b5cad; box-shadow: 0 0 0 3px #bfdcf7; }
  .card p { margin: 4px 0; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 12px; justify-content: space-between; }
  ol.steps { list-style: none; display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; padding: 0; margin: 12px 0; }
  ol.steps li button { width: 100%; min-height: 56px; padding: 4px; font-size: .8rem; line-height: 1.2; border-width: 2px; }
  ol.steps li button[aria-current="step"] { background: #0b5cad; color: #fff; }
  ol.steps li button.done { border-color: #15803d; color: #15803d; }
  ol.steps li button.done[aria-current="step"] { color: #fff; }
  .progress { background: #d9e8e1; border-radius: 6px; height: 12px; overflow: hidden; }
  .progress span { display: block; height: 100%; background: #15803d; }
  label { display: block; font-weight: 600; margin-top: 12px; }
  input, select, textarea { width: 100%; min-height: 48px; padding: 8px; font-size: 1rem; font-family: inherit; border: 2px solid #5b7185; border-radius: 8px; background: #fff; }
  .check { display: flex; gap: 10px; align-items: flex-start; font-weight: 400; background: #fff; border: 2px solid #b6d9c9; border-radius: 10px; padding: 10px; }
  .check input { width: 28px; min-height: 28px; flex: none; }
  .pill { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: .9rem; font-weight: 700; border: 2px solid; }
  .pending { color: #92400e; border-color: #92400e; background: #fef3c7; }
  .approved { color: #166534; border-color: #166534; background: #dcfce7; }
  .msg { font-weight: 600; color: #166534; }
  .badges { display: grid; gap: 8px; grid-template-columns: 1fr; }
  @media (min-width: 600px) { .badges { grid-template-columns: 1fr 1fr; } }
  .badge { border: 2px dashed #9aa9b5; border-radius: 12px; padding: 10px; background: #f3f5f7; color: #5b6b78; }
  .badge.on { border: 2px solid #15803d; background: #dcfce7; color: #12263a; }
  .points { font-size: 2.2rem; font-weight: 800; color: #15803d; }
  .small { font-size: .9rem; color: #3f5468; }
  .demo { border: 2px dashed #0b5cad; border-radius: 10px; padding: 10px; margin: 12px 0; background: #eef6ff; }
</style>
</head>
<body>
  <p><a href="/">Riter CREW</a></p>
  <h1>Fundraiser Hub</h1>
  <div class="notice" role="note">
    <strong>Practice version.</strong> Everything here is sample information. No money is collected, nothing is sent
    to anyone, and progress is saved only in this browser. Please do not type real phone numbers, emails, addresses or last names.
  </div>
  <div id="app"></div>

<script>
(function () {
  var KEY = 'fundraiserHub.v1';
  var STEPS = ['Choose a partner', 'Choose a fundraiser', 'Plan it', 'Run it', 'Points & report'];

  var PARTNERS = [
    { id: 'bwd', name: 'Better Way Detroit', text: 'Helps Detroiters with job training, work readiness and support to find steady work.', needs: 'Needs: job-readiness supplies, interview clothing, community support.' },
    { id: 'drmm', name: 'Detroit Rescue Mission Ministries', text: 'Provides meals, shelter, recovery programs and support for people facing homelessness and addiction.', needs: 'Needs: food, hygiene kits, clothing, blankets, program support.' }
  ];
  var IDEAS = [
    { id: 'bake', name: 'Bake sale', text: 'Sell baked goods at school or a community event.', mats: 'Baked goods, tables, signs, price list, cash box (teacher-held), napkins and bags.' },
    { id: 'car', name: 'Car wash', text: 'Wash cars for donations from the community.', mats: 'Buckets, sponges, towels, hoses, soap, signs, water access.' },
    { id: 'drive', name: 'Clothing or supply donation drive', text: 'Collect items the partner needs, such as clothes or hygiene kits.', mats: 'Collection bins, flyers, a list of wanted items, a sorting table.' },
    { id: 'sports', name: 'Sports tournament', text: 'Host a game or tournament where entry or a donation helps the partner.', mats: 'Space, balls and equipment, sign-up sheet, scoreboard, referees.' },
    { id: 'event', name: 'School fundraising event', text: 'A talent show, spirit night or similar event.', mats: 'Space, sound equipment, performers, tickets or sign-in sheet, posters.' },
    { id: 'custom', name: 'Custom fundraiser idea', text: 'Have your own idea? Describe it in the plan.', mats: 'You decide. List what you need in the plan.' }
  ];
  var TASKS = [
    'Get teacher approval.',
    'Confirm the location and date.',
    'Assign responsibilities.',
    'Gather materials.',
    'Promote the fundraiser.',
    'Hold the event.',
    'Record fundraising results.'
  ];
  var PLAN_FIELDS = [
    ['name', 'Fundraiser name', 'text'], ['goal', 'Fundraising goal (example: $200 or 50 cans)', 'text'],
    ['date', 'Date', 'date'], ['location', 'Location', 'text'],
    ['team', 'Team members (first names) and responsibilities', 'textarea'],
    ['materials', 'Materials needed', 'textarea'], ['promo', 'Promotion plan', 'textarea']
  ];
  var REPORT_FIELDS = [
    ['name', 'Fundraiser name', 'text'], ['partner', 'Selected partner', 'text'], ['date', 'Date completed', 'date'],
    ['amount', 'Amount raised or supplies collected', 'text'], ['people', 'Number of participants', 'number'],
    ['well', 'What went well', 'textarea'], ['learned', 'What we learned', 'textarea']
  ];
  var MESSAGES = [
    'You are about to do something great for Detroit!',
    'Nice choice. Every community helper starts here.',
    'Good planning makes a great fundraiser.',
    'You are doing it. Take it one task at a time.',
    'Look at what you did. Thank you for helping.'
  ];

  var state = load();
  function fresh() {
    return { started: false, step: 0, partner: '', idea: '', plan: {}, tasks: [], approved: false, submitted: false, report: {} };
  }
  function load() {
    try { var s = JSON.parse(localStorage.getItem(KEY)); if (s && typeof s === 'object') return Object.assign(fresh(), s); } catch (e) {}
    return fresh();
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

  var app = document.getElementById('app');
  function h(tag, attrs, kids) {
    var el = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) {
      if (k === 'text') el.textContent = attrs[k];
      else if (k.indexOf('on') === 0) el.addEventListener(k.slice(2), attrs[k]);
      else if (attrs[k] === true) el.setAttribute(k, '');
      else if (attrs[k] !== false && attrs[k] != null) el.setAttribute(k, attrs[k]);
    });
    (kids || []).forEach(function (c) { if (c) el.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return el;
  }
  function find(list, id) { return list.filter(function (x) { return x.id === id; })[0]; }
  function taskDone(i) { return !!state.tasks[i]; }
  function planDone() {
    return ['name', 'goal', 'date', 'location', 'team', 'materials', 'promo'].every(function (k) { return (state.plan[k] || '').trim(); });
  }
  // A task counts only if teacher approval is in place (task 0 is approval itself).
  function canTick(i) { return i === 0 ? false : state.approved; }

  function points() {
    var items = [
      ['Chose a community partner', 10, !!state.partner],
      ['Completed the fundraiser plan', 20, planDone()],
      ['Received teacher approval', 20, state.approved],
      ['Completed preparation tasks', 20, state.approved && [1, 2, 3, 4].every(taskDone)],
      ['Held the fundraiser', 20, state.approved && taskDone(5)],
      ['Submitted a final report', 30, state.submitted]
    ];
    var total = items.reduce(function (n, i) { return n + (i[2] ? i[1] : 0); }, 0);
    return { items: items, total: total };
  }
  function badges() {
    var p = points().items;
    return [
      ['Community Starter', 'Choose a community partner.', p[0][2]],
      ['Fundraiser Planner', 'Finish your fundraiser plan.', p[1][2]],
      ['Team Player', 'Get approval and finish the preparation tasks.', p[2][2] && p[3][2]],
      ['Community Champion', 'Hold the fundraiser and submit your report.', p[4][2] && p[5][2]]
    ];
  }

  function go(n) { state.step = Math.max(0, Math.min(4, n)); save(); render(); document.getElementById('app').focus(); }

  function stepper() {
    var ol = h('ol', { class: 'steps', 'aria-label': 'Five steps' });
    STEPS.forEach(function (s, i) {
      var done = [!!state.partner, !!state.idea, planDone(), state.approved && taskDone(6), state.submitted][i];
      ol.appendChild(h('li', {}, [h('button', {
        type: 'button', class: done ? 'done' : '', 'aria-current': i === state.step ? 'step' : false,
        text: (i + 1) + '. ' + s + (done ? ' ✓' : ''), onclick: function () { go(i); }
      })]));
    });
    var pct = (state.step + 1) * 20;
    return h('div', {}, [ol, h('div', { class: 'progress', role: 'progressbar', 'aria-valuemin': 0, 'aria-valuemax': 100, 'aria-valuenow': pct, 'aria-label': 'Progress' }, [h('span', { style: 'width:' + pct + '%' })]),
      h('p', { class: 'msg', text: MESSAGES[state.step] })]);
  }
  function nav() {
    var back = h('button', { type: 'button', text: '← Back', disabled: state.step === 0, onclick: function () { go(state.step - 1); } });
    var next = h('button', { type: 'button', class: 'primary', text: 'Next →', disabled: state.step === 4, onclick: function () { go(state.step + 1); } });
    return h('div', { class: 'row' }, [back, next]);
  }

  function stepPartner() {
    var box = h('div', {}, [h('h2', { text: 'Step 1: Choose a community partner' })]);
    PARTNERS.forEach(function (p) {
      var sel = state.partner === p.id;
      box.appendChild(h('div', { class: 'card' + (sel ? ' sel' : '') }, [
        h('h3', { text: p.name }), h('p', { text: p.text }), h('p', { class: 'small', text: p.needs }),
        h('button', { type: 'button', class: sel ? 'green' : 'primary', 'aria-pressed': sel, text: sel ? 'Selected ✓' : 'Choose ' + p.name,
          onclick: function () { state.partner = p.id; save(); render(); } })
      ]));
    });
    return box;
  }
  function stepIdea() {
    var box = h('div', {}, [h('h2', { text: 'Step 2: Choose a fundraiser' })]);
    IDEAS.forEach(function (p) {
      var sel = state.idea === p.id;
      box.appendChild(h('div', { class: 'card' + (sel ? ' sel' : '') }, [
        h('h3', { text: p.name }), h('p', { text: p.text }), h('p', { class: 'small', text: 'Suggested materials: ' + p.mats }),
        h('button', { type: 'button', class: sel ? 'green' : 'primary', 'aria-pressed': sel, text: sel ? 'Selected ✓' : 'Choose this idea',
          onclick: function () { state.idea = p.id; save(); render(); } })
      ]));
    });
    return box;
  }
  function stepPlan() {
    var box = h('div', {}, [h('h2', { text: 'Step 3: Plan your fundraiser' }),
      h('p', { class: 'small', text: 'Your answers save in this browser as you type. Use first names only.' })]);
    var status = h('p', { class: 'msg', 'aria-live': 'polite' });
    function upd() { status.textContent = planDone() ? 'Plan complete! You earned the Fundraiser Planner points.' : 'Fill in every box to complete your plan.'; }
    PLAN_FIELDS.forEach(function (f) {
      var id = 'plan-' + f[0];
      var inp = f[2] === 'textarea' ? h('textarea', { id: id, rows: 3 }) : h('input', { id: id, type: f[2] });
      inp.value = state.plan[f[0]] || '';
      inp.addEventListener('input', function () { state.plan[f[0]] = inp.value; save(); upd(); });
      box.appendChild(h('label', { for: id, text: f[1] })); box.appendChild(inp);
    });
    upd(); box.appendChild(status);
    return box;
  }
  function stepRun() {
    var box = h('div', {}, [h('h2', { text: 'Step 4: Run your fundraiser' })]);
    box.appendChild(h('div', { class: 'card' }, [
      h('h3', {}, ['Teacher approval: ', h('span', { class: 'pill ' + (state.approved ? 'approved' : 'pending'), text: state.approved ? 'Approved (sample)' : 'Approval pending' })]),
      h('p', { text: state.approved ? 'This is a sample approval for the demo only.' : 'You must get teacher approval before you start your real fundraiser. The app never approves it for you.' })
    ]));
    var list = h('div', {});
    TASKS.forEach(function (t, i) {
      var id = 'task-' + i;
      var locked = i === 0 || !state.approved;
      var cb = h('input', { type: 'checkbox', id: id, disabled: locked });
      cb.checked = i === 0 ? state.approved : (state.approved && taskDone(i));
      cb.addEventListener('change', function () { if (canTick(i)) { state.tasks[i] = cb.checked; save(); render(); } });
      var extra = i === 0 ? ' (done by your teacher, not by you)' : (!state.approved ? ' (locked until approved)' : '');
      list.appendChild(h('label', { class: 'check', for: id }, [cb, h('span', { text: t + extra })]));
    });
    box.appendChild(list);
    box.appendChild(h('div', { class: 'demo' }, [
      h('strong', { text: 'Prototype demo only' }),
      h('p', { class: 'small', text: 'There is no teacher account yet. To show how approval would look, this switch pretends a teacher approved sample information. In the real version only a teacher can do this.' }),
      h('button', { type: 'button', text: state.approved ? 'Reset to approval pending' : 'Show a sample approval',
        onclick: function () { state.approved = !state.approved; if (!state.approved) { state.tasks = []; } save(); render(); } })
    ]));
    return box;
  }
  function stepPoints() {
    var p = points();
    var box = h('div', {}, [h('h2', { text: 'Step 5: Earn points and badges' })]);
    box.appendChild(h('div', { class: 'card' }, [h('div', { class: 'small', text: 'Your points' }), h('div', { class: 'points', text: p.total + ' / 120' }),
      h('p', { class: 'small', text: 'Points and badges reward taking part and finishing steps. They are not based on how much money was raised.' })]));
    var ul = h('ul', {});
    p.items.forEach(function (i) { ul.appendChild(h('li', { text: (i[2] ? '✓ ' : '○ ') + i[0] + ' (+' + i[1] + ')' })); });
    box.appendChild(ul);
    var bd = h('div', { class: 'badges' });
    badges().forEach(function (b) {
      bd.appendChild(h('div', { class: 'badge' + (b[2] ? ' on' : '') }, [h('strong', { text: (b[2] ? '🏅 ' : '🔒 ') + b[0] }), h('div', { class: 'small', text: b[2] ? 'Earned!' : b[1] })]));
    });
    box.appendChild(bd);

    box.appendChild(h('h2', { text: 'Final report' }));
    if (!state.approved || !taskDone(5)) {
      box.appendChild(h('p', { text: 'The report opens after the fundraiser is approved and you have checked "Hold the event" in Step 4.' }));
      return box;
    }
    var pn = (find(PARTNERS, state.partner) || {}).name || '';
    REPORT_FIELDS.forEach(function (f) {
      var id = 'rep-' + f[0];
      var inp = f[2] === 'textarea' ? h('textarea', { id: id, rows: 3 }) : h('input', { id: id, type: f[2], min: f[2] === 'number' ? 0 : false });
      var def = f[0] === 'name' ? state.plan.name : f[0] === 'partner' ? pn : '';
      inp.value = state.report[f[0]] != null ? state.report[f[0]] : (def || '');
      inp.addEventListener('input', function () { state.report[f[0]] = inp.value; save(); });
      box.appendChild(h('label', { for: id, text: f[1] })); box.appendChild(inp);
    });
    box.appendChild(h('div', { class: 'row' }, [h('button', { type: 'button', class: 'green', text: state.submitted ? 'Update report' : 'Submit report',
      onclick: function () { state.submitted = true; REPORT_FIELDS.forEach(function (f) { var v = document.getElementById('rep-' + f[0]).value; state.report[f[0]] = v; }); save(); render(); } })]));
    if (state.submitted) {
      var r = state.report;
      box.appendChild(h('div', { class: 'card sel' }, [
        h('h3', { text: 'Impact summary' }),
        h('p', { text: (r.name || 'Our fundraiser') + ' supported ' + (r.partner || 'our partner') + (r.date ? ' on ' + r.date : '') + '.' }),
        h('p', { text: 'Reported: ' + (r.amount || 'nothing entered') + ', with ' + (r.people || '0') + ' participants.' }),
        h('p', { text: 'What went well: ' + (r.well || '—') }),
        h('p', { text: 'What we learned: ' + (r.learned || '—') }),
        h('p', { class: 'small', text: 'These results were reported by the students. They have not been independently verified.' })
      ]));
    }
    return box;
  }

  function render() {
    app.innerHTML = '';
    app.setAttribute('tabindex', '-1');
    if (!state.started) {
      app.appendChild(h('div', {}, [
        h('p', { text: 'Organize a fundraiser for Better Way Detroit or Detroit Rescue Mission Ministries. We will guide you through five steps, from picking a partner to earning points and badges.' }),
        h('button', { type: 'button', class: 'big', text: 'RUN FUNDRAISER', onclick: function () { state.started = true; save(); render(); } })
      ]));
      return;
    }
    app.appendChild(stepper());
    app.appendChild([stepPartner, stepIdea, stepPlan, stepRun, stepPoints][state.step]());
    app.appendChild(nav());
    app.appendChild(h('div', { class: 'row' }, [h('button', { type: 'button', text: 'Start over', onclick: function () {
      if (confirm('Erase your saved progress in this browser and start over?')) { state = fresh(); save(); render(); } } })]));
  }
  render();
})();
</script>
  <script src="/build-stamp.js"></script>
</body>
</html>
